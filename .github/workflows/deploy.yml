name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Before Deploy
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @shrd/api --filter @shrd/db --filter @shrd/sdk --filter @shrd/shared

      - name: Run API checks
        run: |
          pnpm typecheck:core
          pnpm --filter @shrd/api test:unit
          pnpm --filter @shrd/api test:compat
          pnpm --filter @shrd/api build

  deploy-api:
    name: Deploy API
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [test]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @shrd/api --filter @shrd/db --filter @shrd/sdk --filter @shrd/shared

      - name: Deploy API to Cloudflare
        working-directory: apps/api
        run: pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  post-deploy-smoke:
    name: Post-Deploy Smoke
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: [deploy-api]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Wait for deployment
        run: sleep 10

      - name: Run smoke test
        run: node scripts/smoke-prod.mjs
        env:
          SHRD_API_URL: https://shrd.stoff.dev
