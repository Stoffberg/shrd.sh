name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install core dependencies
        run: pnpm install --frozen-lockfile --filter @shrd/api --filter @shrd/db --filter @shrd/sdk --filter @shrd/shared

      - name: Run core CI
        run: pnpm ci:full

  release-compat:
    name: Release Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Check release targets
        run: |
          cargo check --manifest-path cli/Cargo.toml --locked --release --target x86_64-unknown-linux-gnu
          cargo check --manifest-path cli/Cargo.toml --locked --release --target x86_64-unknown-linux-musl
          cargo check --manifest-path cli/Cargo.toml --locked --no-default-features
